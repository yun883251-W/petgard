<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGuard 智能安防系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .main-container { padding: 20px; }

        /* 视频显示区域 */
        .video-wrapper {
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .video-feed {
            width: 100%;
            display: block;
        }

        /* 侧边栏卡片 */
        .info-card {
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .card-header {
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        /* 状态颜色 */
        .status-indicator {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .bg-safe { background-color: #1b5e20; color: #81c784; }
        .bg-alert { background-color: #b71c1c; color: #e57373; animation: blink 1s infinite; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 历史表格滚动条 */
        .history-table-container {
            max-height: 450px;
            overflow-y: auto;
        }
        .table { color: #ccc; margin-bottom: 0; }
        .table-hover tbody tr:hover { background-color: #2c2c2c; }

        .play-link {
            color: #00a2ff;
            cursor: pointer;
            text-decoration: none;
        }
        .play-link:hover { text-decoration: underline; }

        /* 模态框视频 */
        .modal-content { background-color: #000; border: 1px solid #444; }

        /* 统计图表容器 */
        .chart-container {
            background: #1f1f1f;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🛡️ PetGuard AI 智能监控后台</span>
        <div>
            <span id="clock" class="text-muted small me-3"></span>
            <button id="configBtn" class="btn btn-sm btn-outline-info">配置</button>
        </div>
    </div>
</nav>

<div class="container-fluid main-container">
    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="video-wrapper">
                <img src="{{ url_for('video_feed') }}" class="video-feed" alt="正在连接视频流...">
                <div style="position: absolute; top: 10px; left: 10px;">
                    <span class="badge bg-danger">LIVE</span>
                </div>
            </div>

            <!-- 图表已移至独立页面 - 抓拍历史管理系统 -->
            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="card info-card text-center">
                        <div class="card-body">
                            <h5>📊 统计图表已移至独立页面</h5>
                            <p class="mb-3">详细的统计分析和抓拍历史管理请访问专门的管理页面</p>
                            <a href="/capture_history" class="btn btn-primary">前往抓拍历史管理系统</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card info-card">
                <div class="card-header">当前状态</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>监测目标：猫、狗</span>
                        <span id="status-tag" class="status-indicator bg-safe">✅ 运行中</span>
                    </div>
                    <div id="alert-msg" class="alert alert-secondary py-2 small">
                        等待系统检测数据...
                    </div>
                    <div class="mt-2">
                        <small class="text-muted">FPS: <span id="fps-value">-</span> | 闯入数: <span id="intruder-count">0</span></small>
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <div class="card-header d-flex justify-content-between">
                    历史记录
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadHistory()">刷新</button>
                </div>
                <div class="card-body p-0 history-table-container">
                    <div id="history-data" class="p-2">
                        <div class="text-center text-muted py-4">暂无历史记录</div>
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <div class="card-header">Top 闯入者</div>
                <div class="card-body p-0">
                    <table class="table table-dark table-sm">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>次数</th>
                            </tr>
                        </thead>
                        <tbody id="top-intruders">
                            <tr><td colspan="2" class="text-center text-muted">暂无数据</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 配置模态框 -->
<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">系统配置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="configForm">
                    <div class="mb-3">
                        <label class="form-label">模型路径</label>
                        <input type="text" class="form-control" id="modelPath" name="detection.model_path">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">置信度阈值</label>
                        <input type="range" class="form-range" min="0.1" max="0.9" step="0.05" id="confThreshold" name="detection.confidence_threshold">
                        <div class="d-flex justify-content-between">
                            <span>低</span>
                            <span id="confValue">0.4</span>
                            <span>高</span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveConfig()">保存配置</button>
            </div>
        </div>
    </div>
</div>

<!-- 图片查看模态框 -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="imageModalTitle">闯入图片详情</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <img id="modalImage" src="" class="w-100 rounded-bottom" alt="闯入图片">
                <div class="p-3 bg-dark text-light">
                    <div id="imageDetails"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 视频回放模态框 (保留但不使用) -->
<div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="modalTitle">闯入回放记录</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <video id="player" controls width="100%" class="rounded-bottom">
                    您的浏览器不支持 HTML5 视频播放。
                </video>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. 更新时钟
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleString();
    }, 1000);

    // 2. 定时获取系统状态 (每秒一次)
    function fetchStatus() {
        fetch('/get_status')
            .then(res => res.json())
            .then(data => {
                const tag = document.getElementById('status-tag');
                const msg = document.getElementById('alert-msg');

                if (data.intruder_count > 0) {
                    tag.innerText = "🚨 闯入警报";
                    tag.className = "status-indicator bg-alert";
                    msg.innerHTML = `<strong>警告：</strong> 检测到 ${data.intruder_count} 只宠物在禁区内！`;
                    msg.className = "alert alert-danger py-2 small";
                    // 警报时自动刷新历史记录
                    loadHistory();
                } else {
                    tag.innerText = "✅ 区域安全";
                    tag.className = "status-indicator bg-safe";
                    msg.innerText = "当前监测区域内无异常。";
                    msg.className = "alert alert-secondary py-2 small";
                }

                // 更新其他状态
                document.getElementById('fps-value').innerText = data.fps ? data.fps.toFixed(1) : '-';
                document.getElementById('intruder-count').innerText = data.intruder_count || 0;
            })
            .catch(err => console.error('获取状态失败:', err));
    }
    setInterval(fetchStatus, 1000);

    // 3. 获取闯入历史记录
    function loadHistory() {
        fetch('/get_history')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('history-data');
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted py-4">暂无历史记录</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    html += `
                    <div class="border-bottom pb-2 mb-2">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <small class="text-muted">${item.Time}</small><br>
                                <strong>宠物ID: ${item.Pet_ID}</strong>
                            </div>
                            <div>
                                ${item.Image_File ? `
                                    <a href="/image_storage/${item.Image_File}" target="_blank" class="btn btn-sm btn-outline-primary">查看图片</a>
                                ` : ''}
                            </div>
                        </div>
                        ${item.Image_File ? `
                            <div class="mt-2">
                                <img src="/image_storage/${item.Image_File}"
                                     class="img-thumbnail"
                                     style="max-width: 100%; max-height: 150px; object-fit: cover;"
                                     alt="闯入图片"
                                     data-bs-toggle="modal"
                                     data-bs-target="#imageModal"
                                     onclick="showImage('${item.Image_File}', '${item.Time}', 'ID: ${item.Pet_ID}')">
                            </div>
                        ` : ''}
                    </div>
                    `;
                });
                container.innerHTML = html;
            })
            .catch(err => console.error('获取历史记录失败:', err));
    }

    // 4. 获取统计数据
    function loadStatistics() {
        fetch('/get_statistics')
            .then(res => res.json())
            .then(data => {
                updateDailyChart(data.daily);
                updateHourlyChart(data.hourly);
                updateTopIntruders(data.top_intruders);
            })
            .catch(err => console.error('获取统计数据失败:', err));
    }

    // 5. 初始化图表
    let dailyChart, hourlyChart;

    function initCharts() {
        const dailyCtx = document.getElementById('dailyChart').getContext('2d');
        dailyChart = new Chart(dailyCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: '闯入次数',
                    data: [],
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        const hourlyCtx = document.getElementById('hourlyChart').getContext('2d');
        hourlyChart = new Chart(hourlyCtx, {
            type: 'bar',
            data: {
                labels: Array.from({length: 24}, (_, i) => `${i}时`),
                datasets: [{
                    label: '闯入次数',
                    data: Array(24).fill(0),
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    // 6. 更新图表
    function updateDailyChart(dailyData) {
        if (!dailyChart) return;

        const dates = Object.keys(dailyData).sort();
        const values = dates.map(date => dailyData[date]);

        dailyChart.data.labels = dates.map(date => date.split('-')[2] + '日');
        dailyChart.data.datasets[0].data = values;
        dailyChart.update();
    }

    function updateHourlyChart(hourlyData) {
        if (!hourlyChart) return;

        const hours = Array.from({length: 24}, (_, i) => i.toString());
        const values = hours.map(h => hourlyData[h] || 0);

        hourlyChart.data.datasets[0].data = values;
        hourlyChart.update();
    }

    function updateTopIntruders(topData) {
        const tbody = document.getElementById('top-intruders');
        if (!topData || topData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">暂无数据</td></tr>';
            return;
        }

        let rows = '';
        topData.forEach(item => {
            rows += `
                <tr>
                    <td>ID: ${item.pet_id}</td>
                    <td>${item.count}次</td>
                </tr>
            `;
        });
        tbody.innerHTML = rows;
    }

    // 7. 处理图片查看
    function showImage(imageFilename, time, petId) {
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('imageModalTitle');
        const imageDetails = document.getElementById('imageDetails');

        const imageUrl = `/image_storage/${imageFilename}?t=${new Date().getTime()}`;

        modalImage.src = imageUrl;
        modalTitle.innerText = `闯入图片：${time}`;
        imageDetails.innerHTML = `
            <strong>时间:</strong> ${time}<br>
            <strong>宠物ID:</strong> ${petId}
        `;
    }

    // 旧的视频播放函数保留兼容性
    function playVideo(filename, time) {
        const player = document.getElementById('player');
        const modalTitle = document.getElementById('modalTitle');

        const videoUrl = `/video_storage/${filename}?t=${new Date().getTime()}`;

        modalTitle.innerText = `回放记录：${time}`;
        player.src = videoUrl;

        const modalElement = document.getElementById('videoModal');
        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        modal.show();

        player.oncanplay = () => {
            player.play().catch(e => console.log("Chrome 自动播放拦截提醒: ", e));
        };

        modalElement.addEventListener('hidden.bs.modal', function () {
            player.pause();
            player.src = "";
        });
    }

    // 8. 配置管理
    document.getElementById('confThreshold').addEventListener('input', function() {
        document.getElementById('confValue').textContent = this.value;
    });

    function loadConfig() {
        fetch('/api/config')
            .then(res => res.json())
            .then(data => {
                document.getElementById('modelPath').value = data.detection?.model_path || 'models/yolov8s.pt';
                document.getElementById('confThreshold').value = data.detection?.confidence_threshold || 0.4;
                document.getElementById('confValue').textContent = data.detection?.confidence_threshold || 0.4;
                document.getElementById('closeDelay').value = data.recording?.close_delay_seconds || 2;
            })
            .catch(err => console.error('加载配置失败:', err));
    }

    function saveConfig() {
        const formData = new FormData(document.getElementById('configForm'));
        const config = {};

        for (let [key, value] of formData.entries()) {
            // 解析嵌套键名，如 'detection.model_path' -> {detection: {model_path: value}}
            const keys = key.split('.');
            let current = config;
            for (let i = 0; i < keys.length - 1; i++) {
                if (!current[keys[i]]) current[keys[i]] = {};
                current = current[keys[i]];
            }
            current[keys[keys.length - 1]] = isNaN(value) ? value : Number(value);
        }

        fetch('/api/config', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(config)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                alert('配置已保存');
                bootstrap.Modal.getInstance(document.getElementById('configModal')).hide();
            } else {
                alert('保存失败: ' + data.error);
            }
        })
        .catch(err => {
            alert('保存失败: ' + err.message);
            console.error('保存配置失败:', err);
        });
    }

    // 事件监听器
    document.getElementById('configBtn').addEventListener('click', function() {
        loadConfig();
        const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('configModal'));
        modal.show();
    });

    // 页面加载后执行
    document.addEventListener('DOMContentLoaded', function() {
        loadHistory();
        initCharts();
        loadStatistics();

        // 每30秒刷新统计数据
        setInterval(loadStatistics, 30000);
    });
</script>

</body>
</html>
