<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGuard 智能安防系统</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .main-container { padding: 20px; }

        /* 视频显示区域 */
        .video-wrapper {
            background: #000;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        .video-feed {
            width: 100%;
            display: block;
        }

        /* 侧边栏卡片 */
        .info-card {
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .card-header {
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            font-weight: bold;
        }

        /* 状态颜色 */
        .status-indicator {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .bg-safe { background-color: #1b5e20; color: #81c784; }
        .bg-alert { background-color: #b71c1c; color: #e57373; animation: blink 1s infinite; }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 历史表格滚动条 */
        .history-table-container {
            max-height: 450px;
            overflow-y: auto;
        }
        .table { color: #ccc; margin-bottom: 0; }
        .table-hover tbody tr:hover { background-color: #2c2c2c; }

        .play-link {
            color: #00a2ff;
            cursor: pointer;
            text-decoration: none;
        }
        .play-link:hover { text-decoration: underline; }

        /* 模态框视频 */
        .modal-content { background-color: #000; border: 1px solid #444; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">🛡️ PetGuard AI 智能监控后台</span>
        <span id="clock" class="text-muted small"></span>
    </div>
</nav>

<div class="container-fluid main-container">
    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="video-wrapper">
                <img src="{{ url_for('video_feed') }}" class="video-feed" alt="正在连接视频流...">
                <div style="position: absolute; top: 10px; left: 10px;">
                    <span class="badge bg-danger">LIVE</span>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card info-card">
                <div class="card-header">当前状态</div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span>监测目标：猫、狗</span>
                        <span id="status-tag" class="status-indicator bg-safe">✅ 运行中</span>
                    </div>
                    <div id="alert-msg" class="alert alert-secondary py-2 small">
                        等待系统检测数据...
                    </div>
                </div>
            </div>

            <div class="card info-card">
                <div class="card-header d-flex justify-content-between">
                    历史记录
                    <button class="btn btn-sm btn-outline-secondary" onclick="loadHistory()">刷新</button>
                </div>
                <div class="card-body p-0 history-table-container">
                    <table class="table table-dark table-striped align-middle">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>对象ID</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-data">
                            <tr><td colspan="3" class="text-center text-muted">暂无历史记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title" id="modalTitle">闯入回放记录</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <video id="player" controls width="100%" class="rounded-bottom">
                    您的浏览器不支持 HTML5 视频播放。
                </video>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. 更新时钟
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleString();
    }, 1000);

    // 2. 定时获取系统状态 (每秒一次)
    function fetchStatus() {
        fetch('/get_status')
            .then(res => res.json())
            .then(data => {
                const tag = document.getElementById('status-tag');
                const msg = document.getElementById('alert-msg');

                if (data.intruder_count > 0) {
                    tag.innerText = "🚨 闯入警报";
                    tag.className = "status-indicator bg-alert";
                    msg.innerHTML = `<strong>警告：</strong> 检测到 ${data.intruder_count} 只宠物在禁区内！`;
                    msg.className = "alert alert-danger py-2 small";
                    // 警报时自动刷新历史记录
                    loadHistory();
                } else {
                    tag.innerText = "✅ 区域安全";
                    tag.className = "status-indicator bg-safe";
                    msg.innerText = "当前监测区域内无异常。";
                    msg.className = "alert alert-secondary py-2 small";
                }
            });
    }
    setInterval(fetchStatus, 1000);

    // 3. 获取闯入历史记录
    function loadHistory() {
        fetch('/get_history')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('history-data');
                if (data.length === 0) return;

                let rows = '';
                data.forEach(item => {
                    rows += `
                        <tr>
                            <td><small>${item.Time.split(' ')[1]}</small></td>
                            <td>ID: ${item.Pet_ID}</td>
                            <td><span class="play-link" onclick="playVideo('${item.Video_File}', '${item.Time}')">查看回放</span></td>
                        </tr>
                    `;
                });
                tbody.innerHTML = rows;
            });
    }

    // 4. 处理 Chrome 视频播放
    function playVideo(filename, time) {
        const player = document.getElementById('player');
        const modalTitle = document.getElementById('modalTitle');

        // 加上时间戳参数防止浏览器读取过时的缓存
        const videoUrl = `/video_storage/${filename}?t=${new Date().getTime()}`;

        modalTitle.innerText = `回放记录：${time}`;
        player.src = videoUrl;

        // 初始化并显示模态框
        const modalElement = document.getElementById('videoModal');
        const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
        modal.show();

        // 视频加载后尝试自动播放
        player.oncanplay = () => {
            player.play().catch(e => console.log("Chrome 自动播放拦截提醒: ", e));
        };

        // 模态框关闭时停止视频，节省 CPU
        modalElement.addEventListener('hidden.bs.modal', function () {
            player.pause();
            player.src = "";
        });
    }

    // 页面加载后立即获取一次历史记录
    document.addEventListener('DOMContentLoaded', loadHistory);
</script>

</body>
</html>
