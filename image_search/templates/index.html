<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGuard 图片搜索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; margin-bottom: 2rem; }
        .stats {
            display: flex; gap: 1rem; justify-content: center;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #1e293b; border-radius: 12px; padding: 1.2rem 2rem;
            border: 1px solid #334155;
        }
        .stat-card .num { font-size: 2rem; font-weight: 700; color: #60a5fa; }
        .stat-card .label { font-size: 0.85rem; color: #64748b; margin-top: 0.3rem; }
        .btn {
            display: inline-block; padding: 0.8rem 2rem; border-radius: 8px;
            text-decoration: none; font-size: 1rem; cursor: pointer; border: none;
            transition: all 0.2s;
        }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
        .btn-secondary:hover { background: #334155; }
        .actions { display: flex; gap: 1rem; justify-content: center; }
        .info { margin-top: 2rem; font-size: 0.85rem; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 PetGuard 智能搜索</h1>
        <p>用自然语言搜索你的宠物闯入抓拍截图</p>

        <div class="stats">
            <div class="stat-card">
                <div class="num">{{ stats.total_indexed }}</div>
                <div class="label">已索引图片</div>
            </div>
        </div>

        <div class="actions">
            <a href="/search" class="btn btn-primary">开始搜索</a>
        </div>

        <div class="info">
            <p>支持：自然语言搜索 · 对话式交互 · 按时间过滤</p>
        </div>
    </div>
</body>
</html>
