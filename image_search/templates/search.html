<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetGuard 智能搜索</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── 顶部导航 ── */
        .header {
            padding: 0.8rem 1.5rem;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .header-actions {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .header-actions .stats-text {
            font-size: 0.8rem;
            color: #64748b;
        }
        .header-btn {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.15s;
        }
        .header-btn:hover {
            background: #334155;
            color: #e2e8f0;
        }

        /* ── 对话区域 ── */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* ── 消息气泡 ── */
        .message {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }
        .message.user {
            text-align: right;
        }
        .message-bubble {
            display: inline-block;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            text-align: left;
            max-width: 75%;
            line-height: 1.5;
            font-size: 0.92rem;
        }
        .message.user .message-bubble {
            background: #3b82f6;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-bubble {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }

        /* ── 搜索结果网格 ── */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.8rem;
            margin-top: 0.8rem;
        }
        .result-card {
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: border-color 0.15s;
            cursor: pointer;
        }
        .result-card:hover {
            border-color: #3b82f6;
        }
        .result-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            background: #0f172a;
        }
        .result-card .info {
            padding: 0.4rem 0.6rem;
            font-size: 0.75rem;
        }
        .result-card .info .time {
            color: #64748b;
        }
        .result-card .info .pet-id {
            color: #60a5fa;
        }
        .result-card .info .score {
            color: #34d399;
        }

        /* ── 空状态 ── */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #475569;
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            color: #64748b;
            margin-bottom: 0.5rem;
        }

        /* ── 输入框 ── */
        .input-area {
            padding: 1rem 1.5rem;
            background: #1e293b;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }
        .input-row {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            gap: 0.6rem;
        }
        .input-row input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .input-row input:focus {
            border-color: #3b82f6;
        }
        .input-row input::placeholder {
            color: #475569;
        }
        .input-row button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            background: #3b82f6;
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .input-row button:hover {
            background: #2563eb;
        }
        .input-row button:disabled {
            background: #1e40af;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hint-text {
            max-width: 820px;
            margin: 0.6rem auto 0;
            font-size: 0.78rem;
            color: #475569;
        }
        .hint-text span {
            cursor: pointer;
            color: #64748b;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 2px;
        }
        .hint-text span:hover {
            color: #94a3b8;
        }

        /* ── 加载动画 ── */
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .loading .dot {
            width: 6px;
            height: 6px;
            background: #64748b;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .loading .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* ── 预览弹窗 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        /* ── 滚动条 ── */
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        @media (max-width: 600px) {
            .results-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <h1>🔍 PetGuard 智能搜索</h1>
        <div class="header-actions">
            <span class="stats-text">已索引 {{ stats.total_indexed }} 张</span>
            <button class="header-btn" onclick="clearHistory()">清空对话</button>
            <a href="/" class="header-btn" style="text-decoration:none;">返回首页</a>
        </div>
    </div>

    <!-- 对话区域 -->
    <div class="chat-area" id="chatArea">
        <div class="message assistant">
            <div class="message-bubble">
                👋 你好！我可以帮你搜索宠物闯入抓拍截图。<br>
                试试问我：<br>
                <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('今天凌晨有哪些截图')">"今天凌晨有哪些截图"</span><br>
                <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('宠物ID 3 的图片')">"宠物ID 3 的图片"</span><br>
                <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('晚上拍到的')">"晚上拍到的"</span>
            </div>
        </div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <div class="input-row">
            <input
                type="text"
                id="queryInput"
                placeholder="用自然语言描述你想找的图片..."
                onkeydown="if(event.key==='Enter') sendQuery()"
            />
            <button id="sendBtn" onclick="sendQuery()">搜索</button>
        </div>
        <div class="hint-text">
            💡 试试：
            <span onclick="quickQuery('最近三次闯入')">最近三次</span> ·
            <span onclick="quickQuery('猫还是狗')">猫还是狗</span> ·
            <span onclick="quickQuery('上周的记录')">上周的记录</span> ·
            <span onclick="quickQuery('ID 3的宠物')">ID 3的宠物</span>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div class="modal-overlay" id="previewModal" onclick="closePreview()">
        <img id="previewImage" src="" alt="preview">
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');

        // 快速查询
        function quickQuery(text) {
            queryInput.value = text;
            sendQuery();
        }

        // 滚动到底部
        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 添加消息
        function addMessage(role, content, results) {
            const div = document.createElement('div');
            div.className = 'message ' + role;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            // 将回答中的换行转为HTML
            bubble.innerHTML = content.replace(/\n/g, '<br>');

            div.appendChild(bubble);

            // 如果有搜索结果，显示图片网格
            if (results && results.length > 0) {
                const grid = document.createElement('div');
                grid.className = 'results-grid';

                results.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.onclick = () => openPreview('/images/' + r.image_file);

                    card.innerHTML = `
                        <img src="/images/${r.image_file}" alt="${r.image_file}" loading="lazy"
                             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 90%22><rect fill=%221e293b%22 width=%22160%22 height=%2290%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22475569%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2212%22>加载失败</text></svg>'">
                        <div class="info">
                            <span class="time">${r.time || '未知时间'}</span>
                            <span class="pet-id"> · ID ${r.pet_id || '?'}</span>
                            <span class="score"> · ${(r.score * 100).toFixed(0)}%</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                div.appendChild(grid);
            }

            chatArea.appendChild(div);
            scrollToBottom();
        }

        // 添加加载指示器
        function addLoading() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'loadingMsg';
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="loading">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            `;
            chatArea.appendChild(div);
            scrollToBottom();
        }

        function removeLoading() {
            const el = document.getElementById('loadingMsg');
            if (el) el.remove();
        }

        // 发送查询
        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            // 显示用户消息
            addMessage('user', query);
            queryInput.value = '';
            sendBtn.disabled = true;

            // 显示加载动画
            addLoading();

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, top_k: 12 }),
                });
                const data = await resp.json();

                removeLoading();

                if (data.error) {
                    addMessage('assistant', '❌ 出错了：' + data.error);
                    return;
                }

                // 显示AI回答，带图片结果
                addMessage('assistant', data.answer, data.results);

            } catch (err) {
                removeLoading();
                addMessage('assistant', '❌ 网络错误，请检查服务是否运行。' + err.message);
            } finally {
                sendBtn.disabled = false;
                queryInput.focus();
            }
        }

        // 清空对话
        async function clearHistory() {
            try {
                await fetch('/api/chat/clear', { method: 'POST' });
            } catch (_) {}
            chatArea.innerHTML = `
                <div class="message assistant">
                    <div class="message-bubble">
                        👋 你好！我可以帮你搜索宠物闯入抓拍截图。<br>
                        试试问我：<br>
                        <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('今天凌晨有哪些截图')">"今天凌晨有哪些截图"</span><br>
                        <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('宠物ID 3 的图片')">"宠物ID 3 的图片"</span><br>
                        <span style="color:#60a5fa;cursor:pointer;" onclick="quickQuery('晚上拍到的')">"晚上拍到的"</span>
                    </div>
                </div>
            `;
        }

        // 图片预览
        function openPreview(src) {
            document.getElementById('previewImage').src = src;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        // 聚焦输入框
        queryInput.focus();
    </script>
</body>
</html>
